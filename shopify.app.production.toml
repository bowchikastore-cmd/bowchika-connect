# Production configuration for the Render-hosted app.
# Keep shopify.app.toml as the Shopify CLI-managed development configuration.

client_id = "697f856bc22d1ade36e6686bdd1ef199"
application_url = "https://bowchika-connect.onrender.com"
embedded = true
name = "bowchika-connect"

[access_scopes]
scopes = "read_customers,read_orders"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://bowchika-connect.onrender.com/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false
