name: Deploy Shopify app configuration

on:
  push:
    branches:
      - main
    paths:
      - "shopify.app.production.toml"
      - ".github/workflows/deploy-shopify-app-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Shopify app automation token
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "::error::Add SHOPIFY_APP_AUTOMATION_TOKEN in GitHub repository Actions secrets. Create an app-scoped automation token for Bowchika Connect in Shopify Dev Dashboard."
            exit 1
          fi

      - name: Release production app configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: npx --yes @shopify/cli@latest app deploy --config production --allow-updates --no-color
